name: Temporary Oxfmt Fix

on:
  push:
    branches: [feat/agent-plugins-1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/agent-plugins-1
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Format flagged files
        run: npx oxfmt mcp.json plugin.json src/mcp-server.ts src/proxy.ts src/token-store.ts test/plugin.test.mjs
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp.json plugin.json src/mcp-server.ts src/proxy.ts src/token-store.ts test/plugin.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: apply oxfmt"
          git push origin HEAD:feat/agent-plugins-1
